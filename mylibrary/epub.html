<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="shortcut icon" href="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png">
  <title>EPUB Reader</title>
  <script src="assets/jszip.min.js"></script>
  <script src="assets/epub.min.js"></script>
  <style>
    :root {
      --bg:#1a1714; --surface:#221f1b; --surface2:#2c2824;
      --border:rgba(255,255,255,0.07); --text:#e8e0d4; --text-dim:#7a7268;
      --accent:#c9a96e; --accent2:#e8c992;
      --ui-font:'Georgia',serif; --mono:'Courier New',monospace;
      --radius:6px; --tr:0.22s cubic-bezier(0.4,0,0.2,1);
      --topbar-h:48px; --bottombar-h:44px;
    }
    [data-theme="light"]{ --bg:#f5f0e8;--surface:#ede7da;--surface2:#e4ddd0;--border:rgba(0,0,0,0.09);--text:#2a2520;--text-dim:#8a8278;--accent:#8b6914;--accent2:#6b4f0e; }
    [data-theme="night"]{ --bg:#0d0c0a;--surface:#141210;--surface2:#1a1815;--border:rgba(255,255,255,0.05);--text:#c8c0b4;--text-dim:#5a5248;--accent:#c9a96e;--accent2:#e8c992; }
    [data-theme="sepia"]{ --bg:#f0e8d8;--surface:#e8dfc8;--surface2:#e0d6bc;--border:rgba(0,0,0,0.08);--text:#3d2b1a;--text-dim:#8a7258; --accent:#8b5e2a;--accent2:#6b4414; }

    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;font-family:var(--ui-font);background:var(--bg);color:var(--text);overflow:hidden;touch-action:none;}

    #shell{display:flex;flex-direction:column;height:100vh;height:100dvh;}

    /* ── Topbar ── */
    #topbar{
      display:flex;align-items:center;gap:8px;padding:0 12px;
      height:var(--topbar-h);background:var(--surface);
      border-bottom:1px solid var(--border);flex-shrink:0;user-select:none;
    }
    .brand{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600;flex-shrink:0;}
    #book-title{flex:1;font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;padding:0 4px;}
    .tb-btn{
      background:none;border:1px solid transparent;color:var(--text-dim);cursor:pointer;
      min-width:40px;min-height:40px;width:40px;height:40px;
      border-radius:var(--radius);display:flex;align-items:center;justify-content:center;
      transition:all var(--tr);flex-shrink:0;-webkit-tap-highlight-color:transparent;
    }
    .tb-btn:active,.tb-btn:hover{color:var(--text);border-color:var(--border);background:var(--surface2);}
    .tb-btn svg{width:18px;height:18px;}

    /* ── Main ── */
    #main{flex:1;display:flex;overflow:hidden;position:relative;}

    /* ── Sidebar ── */
    #sidebar{
      width:280px;flex-shrink:0;background:var(--surface);
      border-right:1px solid var(--border);display:flex;flex-direction:column;
      transform:translateX(-100%);transition:transform var(--tr);
      position:absolute;left:0;top:0;bottom:0;z-index:200;
    }
    #sidebar.open{transform:translateX(0);}
    #sidebar-head{
      padding:14px 16px 10px;border-bottom:1px solid var(--border);
      font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
      display:flex;align-items:center;justify-content:space-between;
    }
    #toc-list{flex:1;overflow-y:auto;padding:6px 0;-webkit-overflow-scrolling:touch;}
    #toc-list::-webkit-scrollbar{width:3px;}
    #toc-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
    .toc-item{
      display:block;padding:11px 16px;font-size:14px;color:var(--text-dim);
      cursor:pointer;border:none;background:none;width:100%;text-align:left;
      transition:color var(--tr),background var(--tr);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      -webkit-tap-highlight-color:transparent;
    }
    .toc-item:active,.toc-item:hover{color:var(--text);background:var(--surface2);}
    .toc-item.active{color:var(--accent2);}
    .toc-item[data-depth="1"]{padding-left:28px;font-size:13px;}
    .toc-item[data-depth="2"]{padding-left:42px;font-size:12px;}
    #sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:199;}
    #sidebar-overlay.show{display:block;}

    /* ── Stage ── */
    #stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:var(--bg);}

    /* ── Tap zones (mobile page flip) ── */
    #tap-zone-prev,#tap-zone-next{
      position:absolute;top:0;bottom:0;width:22%;z-index:5;
      cursor:pointer;-webkit-tap-highlight-color:transparent;
      display:flex;align-items:center;
    }
    #tap-zone-prev{left:0;justify-content:flex-start;padding-left:4px;}
    #tap-zone-next{right:0;justify-content:flex-end;padding-right:4px;}
    .tap-arrow{
      opacity:0;width:32px;height:56px;background:var(--surface);border:1px solid var(--border);
      border-radius:var(--radius);display:flex;align-items:center;justify-content:center;
      color:var(--text-dim);transition:opacity .2s;pointer-events:none;
    }
    #tap-zone-prev:active .tap-arrow,#tap-zone-next:active .tap-arrow{opacity:.8;}
    .tap-arrow svg{width:18px;height:18px;}

    #viewer-wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
    #viewer{background:#faf7f2;box-shadow:0 4px 40px rgba(0,0,0,.35);border-radius:2px;transition:background var(--tr);}
    [data-theme="night"] #viewer,[data-theme="dark"] #viewer{background:#1a1714;}
    [data-theme="light"] #viewer{background:#faf7f2;}
    [data-theme="sepia"] #viewer{background:#f4ede0;}

    /* ── Bottombar ── */
    #bottombar{
      height:var(--bottombar-h);background:var(--surface);border-top:1px solid var(--border);
      display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;
    }
    #progress-wrap{
      flex:1;height:6px;background:var(--surface2);border-radius:3px;
      cursor:pointer;overflow:hidden;position:relative;
    }
    #progress-bar{height:100%;background:var(--accent);border-radius:3px;width:0%;transition:width .3s;}
    #location-info{font-size:11px;color:var(--text-dim);white-space:nowrap;letter-spacing:.04em;min-width:60px;text-align:right;}

    /* ── Settings panel ── */
    #settings-panel{
      position:absolute;bottom:calc(var(--bottombar-h) + 8px);right:8px;
      width:min(240px,calc(100vw - 16px));
      background:var(--surface);border:1px solid var(--border);
      border-radius:10px;padding:16px;z-index:300;display:none;
      box-shadow:0 8px 32px rgba(0,0,0,.5);
    }
    #settings-panel.open{display:block;}
    .sl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;margin-top:14px;}
    .sl:first-child{margin-top:0;}
    .sr{display:flex;gap:6px;flex-wrap:wrap;}
    .sett-btn{
      background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);
      padding:7px 12px;font-size:12px;border-radius:var(--radius);cursor:pointer;
      transition:all var(--tr);font-family:var(--ui-font);-webkit-tap-highlight-color:transparent;
    }
    .sett-btn:active,.sett-btn.active{color:var(--accent2);border-color:var(--accent);background:var(--surface);}
    .font-size-row{display:flex;align-items:center;gap:10px;}
    .font-size-row button{
      width:36px;height:36px;border-radius:50%;background:var(--surface2);
      border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:18px;
      display:flex;align-items:center;justify-content:center;transition:all var(--tr);
      -webkit-tap-highlight-color:transparent;
    }
    .font-size-row button:active{background:var(--surface);border-color:var(--accent);}
    #font-size-val{flex:1;text-align:center;font-size:14px;color:var(--text-dim);}

    /* ── Loading ── */
    #loading{
      position:absolute;inset:0;background:var(--bg);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:16px;z-index:500;transition:opacity .4s;
    }
    #loading.hidden{opacity:0;pointer-events:none;}
    .spinner{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    #loading p{font-size:13px;color:var(--text-dim);}

    /* ── Welcome ── */
    #welcome{
      position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:14px;z-index:400;text-align:center;
      padding:24px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;
    }
    #welcome.hidden{display:none;}
    #welcome h2{font-size:22px;color:var(--accent);font-weight:normal;}
    #welcome p{font-size:14px;color:var(--text-dim);max-width:400px;line-height:1.7;}
    #welcome code{font-family:var(--mono);font-size:11px;background:var(--surface2);padding:2px 6px;border-radius:3px;color:var(--accent2);}
    #url-input-wrap{display:flex;gap:8px;width:100%;max-width:460px;}
    #url-input{
      flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);
      padding:11px 12px;border-radius:var(--radius);font-size:14px;font-family:var(--mono);
      outline:none;transition:border-color var(--tr);min-width:0;
    }
    #url-input:focus{border-color:var(--accent);}
    #url-input::placeholder{color:var(--text-dim);}
    #open-url-btn{
      background:var(--accent);border:none;color:#1a1714;padding:11px 18px;
      border-radius:var(--radius);font-size:14px;cursor:pointer;font-weight:600;
      white-space:nowrap;-webkit-tap-highlight-color:transparent;
    }
    #drop-zone{
      border:1px dashed var(--border);border-radius:var(--radius);
      padding:18px 28px;cursor:pointer;font-size:14px;color:var(--text-dim);
      transition:all var(--tr);width:100%;max-width:460px;text-align:center;
      -webkit-tap-highlight-color:transparent;
    }
    #drop-zone:active{border-color:var(--accent);color:var(--accent);background:var(--surface2);}
    #file-input{display:none;}
    #error-msg{color:#e07070;font-size:13px;display:none;}
    #error-msg.show{display:block;}

    /* ── Responsive ── */
    @media(max-width:480px){
      #topbar{padding:0 8px;gap:4px;}
      .tb-btn{min-width:36px;width:36px;height:36px;}
      #book-title{font-size:11px;}
      #settings-panel{right:4px;left:4px;width:auto;}
    }
  </style>
</head>
<body data-theme="dark">
<div id="shell">
  <div id="topbar">
    <span class="brand">📖 Epub</span>
    <div id="book-title">—</div>
    <button class="tb-btn" id="toc-btn" title="Mục lục">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="16" y2="12"/><line x1="3" y1="18" x2="12" y2="18"/>
      </svg>
    </button>
    <button class="tb-btn" id="settings-btn" title="Cài đặt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div id="main">
    <div id="sidebar">
      <div id="sidebar-head">
        <span>Mục lục</span>
        <button class="tb-btn" id="close-sidebar-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="toc-list"></div>
    </div>
    <div id="sidebar-overlay"></div>

    <div id="stage">
      <div id="welcome">
        <h2>EPUB Reader</h2>
        <p>Truyền URL file EPUB qua <code>?url=https://...</code> hoặc nhập bên dưới.</p>
        <div id="url-input-wrap">
          <input id="url-input" type="url" inputmode="url" placeholder="https://example.com/book.epub" />
          <button id="open-url-btn">Mở</button>
        </div>
        <div id="drop-zone">📂 Nhấn để chọn file EPUB</div>
        <input type="file" id="file-input" accept=".epub" />
        <p id="error-msg"></p>
      </div>

      <div id="viewer-wrap" style="display:none;">
        <!-- Tap zones for mobile page flip -->
        <div id="tap-zone-prev">
          <div class="tap-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></div>
        </div>
        <div id="viewer"></div>
        <div id="tap-zone-next">
          <div class="tap-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></div>
        </div>
      </div>

      <div id="loading" class="hidden">
        <div class="spinner"></div>
        <p id="loading-msg">Đang tải sách...</p>
      </div>

      <div id="settings-panel">
        <div class="sl">Giao diện</div>
        <div class="sr">
          <button class="sett-btn active" data-theme="dark">Tối</button>
          <button class="sett-btn" data-theme="light">Sáng</button>
          <button class="sett-btn" data-theme="night">Đêm</button>
          <button class="sett-btn" data-theme="sepia">Sepia</button>
        </div>
        <div class="sl">Cỡ chữ</div>
        <div class="font-size-row">
          <button id="font-dec">−</button>
          <span id="font-size-val">100%</span>
          <button id="font-inc">+</button>
        </div>
        <div class="sl">Chế độ đọc</div>
        <div class="sr">
          <button class="sett-btn active" data-flow="paginated">Lật trang</button>
          <button class="sett-btn" data-flow="scrolled-continuous">Cuộn</button>
        </div>
      </div>
    </div>
  </div>

  <div id="bottombar">
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <span id="location-info">—</span>
  </div>
</div>

<script>
(function() {
  let book = null, rendition = null;
  let fontSize = 100, currentFlow = 'paginated', currentTheme = 'dark';
  const CORS_PROXY = 'https://corsproxy.io/?';
  const $id = id => document.getElementById(id);
  const welcome    = $id('welcome');
  const viewerWrap = $id('viewer-wrap');
  const viewer     = $id('viewer');
  const loading    = $id('loading');
  const sidebar    = $id('sidebar');
  const overlay    = $id('sidebar-overlay');

  function getViewerSize() {
    const s = $id('stage');
    const w = s.clientWidth;
    const h = s.clientHeight;
    return { width: Math.min(w, 900), height: h };
  }

  function showLoading(msg) {
    $id('loading-msg').textContent = msg || 'Đang tải sách...';
    loading.classList.remove('hidden');
  }
  function hideLoading() { loading.classList.add('hidden'); }

  function showError(msg) {
    $id('error-msg').textContent = msg;
    $id('error-msg').classList.add('show');
    hideLoading();
    welcome.classList.remove('hidden');
    viewerWrap.style.display = 'none';
  }

  async function openBook(source, isUrl) {
    if (book) { try { book.destroy(); } catch(e) {} }
    book = null; rendition = null;
    welcome.classList.add('hidden');
    $id('error-msg').classList.remove('show');
    viewerWrap.style.display = 'none';
    showLoading(isUrl ? 'Đang tải file từ URL...' : 'Đang mở sách...');

    try {
      book = ePub(isUrl ? source : source);
      try {
        await Promise.race([book.opened, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]);
      } catch(e) {
        if (isUrl) {
          $id('loading-msg').textContent = 'Thử qua CORS proxy...';
          book = ePub(CORS_PROXY + encodeURIComponent(source));
        } else throw e;
      }

      await book.ready;
      const meta = await book.loaded.metadata;
      document.title = (meta.title || 'EPUB') + ' — Reader';
      $id('book-title').textContent = meta.title || 'Không có tiêu đề';

      const { width, height } = getViewerSize();
      viewer.style.width  = width  + 'px';
      viewer.style.height = height + 'px';

      rendition = book.renderTo('viewer', {
        width, height, flow: currentFlow, spread: 'none',
        allowScriptedContent: false  // tắt script trong EPUB để tránh sandbox block
      });
      applyReaderTheme();
      applyFontSize();

      const savedLoc = localStorage.getItem('epub_loc_' + (meta.identifier || source));
      await rendition.display(savedLoc || undefined);

      // Đợi spine load xong
      await book.spine.ready;

      const toc = await book.loaded.navigation;
      renderTOC(toc.toc);

      rendition.on('relocated', onRelocated);
      // Forward key events from iframe
      rendition.on('keyup', onKey);

      hideLoading();
      viewerWrap.style.display = 'flex';

      // Hook touch events inside iframe after render
      hookIframeTouch();
    } catch(err) {
      console.error(err);
      showError('Không thể tải EPUB. ' + (err.message || ''));
      welcome.classList.remove('hidden');
    }
  }

  // ── Hook touch inside epubjs iframe ──────────────────────────
  function hookIframeTouch() {
    try {
      const iframe = viewer.querySelector('iframe');
      if (!iframe) return;
      const doc = iframe.contentDocument || iframe.contentWindow?.document;
      if (!doc) return;
      let tx = null, ty = null;
      doc.addEventListener('touchstart', e => {
        tx = e.touches[0].clientX;
        ty = e.touches[0].clientY;
      }, { passive: true });
      doc.addEventListener('touchend', e => {
        if (tx === null) return;
        const dx = e.changedTouches[0].clientX - tx;
        const dy = e.changedTouches[0].clientY - ty;
        tx = null; ty = null;
        if (Math.abs(dx) < 40 || Math.abs(dy) > Math.abs(dx) * 1.2) return;
        if (dx < 0) rendition && rendition.next();
        else        rendition && rendition.prev();
      });
    } catch(e) {}
    // Also re-hook when page changes
    rendition && rendition.on('rendered', () => setTimeout(hookIframeTouch, 200));
  }

  function renderTOC(items, depth) {
    depth = depth || 0;
    items.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'toc-item';
      btn.textContent = item.label.trim();
      btn.dataset.depth = depth;
      btn.onclick = () => {
        if (!rendition || !item.href) return;
        closeSidebar();
            navigateToHref(item.href);
      };
      $id('toc-list').appendChild(btn);
      if (item.subitems && item.subitems.length) renderTOC(item.subitems, depth + 1);
    });
  }

  async function navigateToHref(href) {
    if (!href) return;

    // Tách anchor
    const hashIdx = href.indexOf('#');
    const pathPart = hashIdx >= 0 ? href.slice(0, hashIdx) : href;
    const anchor   = hashIdx >= 0 ? href.slice(hashIdx + 1) : null;
    const filename = pathPart.split('/').pop().toLowerCase();

    // Duyệt spine tìm item khớp
    const items = book.spine.items || [];
    let found = null;
    for (const item of items) {
      const h = (item.href || item.url || '').toLowerCase();
      const hNoQuery = h.split('?')[0];
      if (
        hNoQuery === pathPart.toLowerCase() ||
        hNoQuery.endsWith('/' + filename) ||
        hNoQuery === filename
      ) { found = item; break; }
    }

    if (found) {
      const baseHref = found.href || found.url || '';
      const target   = anchor ? baseHref + '#' + anchor : baseHref;
        try { await rendition.display(target); return; } catch(e) {
      }
    }

    // Fallback 1: display href gốc
    try { await rendition.display(href); return; } catch(e) {
    }

    // Fallback 2: chỉ dùng filename
    try { await rendition.display(filename); } catch(e) {
    }
  }

  function onRelocated(location) {
    if (!location) return;
    const pct = Math.round((location.start.percentage || 0) * 100);
    $id('progress-bar').style.width = pct + '%';
    $id('location-info').textContent = location.start.displayed
      ? `${location.start.displayed.page}/${location.start.displayed.total}`
      : pct + '%';
    try {
      const key = 'epub_loc_' + (book.package.metadata.identifier || 'default');
      localStorage.setItem(key, location.start.cfi);
    } catch(e) {}
  }

  function onKey(e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') rendition && rendition.next();
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   rendition && rendition.prev();
  }
  document.addEventListener('keyup', onKey);

  function applyReaderTheme() {
    if (!rendition) return;
    const map = {
      dark:  { body: { color:'#e8e0d4 !important', background:'#1a1714 !important' } },
      light: { body: { color:'#2a2520 !important', background:'#faf7f2 !important' } },
      night: { body: { color:'#c8c0b4 !important', background:'#0d0c0a !important' } },
      sepia: { body: { color:'#3d2b1a !important', background:'#f4ede0 !important' } },
    };
    rendition.themes.register('t', map[currentTheme] || map.light);
    rendition.themes.select('t');
  }

  function applyFontSize() {
    if (!rendition) return;
    rendition.themes.fontSize(fontSize + '%');
    $id('font-size-val').textContent = fontSize + '%';
  }

  // Resize
  let rt;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      if (!rendition) return;
      const { width, height } = getViewerSize();
      viewer.style.width = width + 'px';
      viewer.style.height = height + 'px';
      rendition.resize(width, height);
    }, 200);
  });

  // Progress bar
  $id('progress-wrap').addEventListener('click', e => {
    if (!book || !rendition) return;
    const r = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - r.left) / r.width;
    const cfi = book.locations.cfiFromPercentage(pct);
    if (cfi) rendition.display(cfi);
  });

  // Tap zones (mobile)
  $id('tap-zone-prev').addEventListener('click', () => rendition && rendition.prev());
  $id('tap-zone-next').addEventListener('click', () => rendition && rendition.next());

  // Sidebar
  function openSidebar()  { sidebar.classList.add('open');    overlay.classList.add('show'); }
  function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('show'); }
  $id('toc-btn').addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
  $id('close-sidebar-btn').addEventListener('click', closeSidebar);
  overlay.addEventListener('click', closeSidebar);

  // Settings
  const sp = $id('settings-panel');
  $id('settings-btn').addEventListener('click', e => { e.stopPropagation(); sp.classList.toggle('open'); });
  document.addEventListener('click', e => {
    if (!sp.contains(e.target) && e.target !== $id('settings-btn')) sp.classList.remove('open');
  });

  document.querySelectorAll('[data-theme]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTheme = btn.dataset.theme;
      document.body.setAttribute('data-theme', currentTheme);
      document.querySelectorAll('[data-theme]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyReaderTheme();
    });
  });

  $id('font-inc').addEventListener('click', () => { if (fontSize < 200) { fontSize += 10; applyFontSize(); } });
  $id('font-dec').addEventListener('click', () => { if (fontSize > 60)  { fontSize -= 10; applyFontSize(); } });

  document.querySelectorAll('[data-flow]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!rendition || currentFlow === btn.dataset.flow) return;
      currentFlow = btn.dataset.flow;
      document.querySelectorAll('[data-flow]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const loc = rendition.currentLocation();
      rendition.destroy();
      const { width, height } = getViewerSize();
      rendition = book.renderTo('viewer', { width, height, flow: currentFlow, spread: 'none' });
      applyReaderTheme(); applyFontSize();
      rendition.display(loc && loc.start ? loc.start.cfi : undefined);
      rendition.on('relocated', onRelocated);
      setTimeout(hookIframeTouch, 400);
    });
  });

  // URL input
  $id('open-url-btn').addEventListener('click', () => {
    const url = $id('url-input').value.trim();
    if (!url) return;
    const nu = new URL(window.location.href);
    nu.searchParams.set('url', url);
    history.pushState(null, '', nu);
    openBook(url, true);
  });
  $id('url-input').addEventListener('keydown', e => { if (e.key === 'Enter') $id('open-url-btn').click(); });

  // File pick
  $id('drop-zone').addEventListener('click', () => $id('file-input').click());
  $id('drop-zone').addEventListener('dragover', e => { e.preventDefault(); $id('drop-zone').style.borderColor='var(--accent)'; });
  $id('drop-zone').addEventListener('dragleave', () => { $id('drop-zone').style.borderColor=''; });
  $id('drop-zone').addEventListener('drop', e => {
    e.preventDefault(); $id('drop-zone').style.borderColor='';
    const f = e.dataTransfer.files[0]; if (f) loadFile(f);
  });
  $id('file-input').addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

  function loadFile(file) {
    if (!file.name.endsWith('.epub')) { showError('Vui lòng chọn file .epub'); return; }
    const r = new FileReader();
    r.onload = e => openBook(e.target.result, false);
    r.readAsArrayBuffer(file);
  }

  // Bootstrap
  const params = new URLSearchParams(window.location.search);
  const epubUrl = params.get('url') || params.get('book');
  if (epubUrl) { $id('url-input').value = epubUrl; openBook(epubUrl, true); }
})();
</script>
</body>
</html>
