<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Thư viện sách/audio."
  />
  <title>Thư viện ebook, sách nói</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <a class="brand" href="./" aria-label="Trang chủ">
        <img src="./assets/logo.png" alt="Thư viện ebook, sách nói" />
      </a>

      <nav class="navbar">
        <div class="nav-dropdown">
          <button class="nav-link nav-toggle" type="button">Thể Loại Sách <span class="caret">▼</span></button>
          <div id="categoryMenu" class="dropdown-menu"></div>
        </div>
      </nav>

      <form class="search-form" id="searchForm" role="search">
        <input id="searchInput" type="search" placeholder="Search" autocomplete="off" />
        <button type="submit" aria-label="Tìm kiếm">⌕</button>
      </form>
    </header>

    <main class="page">
      <section class="content-grid">
        <div class="main-column">
          <div class="status-line" id="statusLine">Đang tải dữ liệu...</div>
          <div id="bookList" class="book-list"></div>
          <div id="pagination" class="pagination"></div>
          <div id="emptyState" class="empty-state" hidden>
            Không tìm thấy kết quả phù hợp.
          </div>
        </div>

        <aside class="sidebar">
          <div class="box">
            <div class="box-title">Thể Loại Sách</div>
            <div id="sidebarCategories" class="cat-list"></div>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <dialog id="bookDialog" class="dialog">
    <div class="dialog-card">
      <button class="dialog-close" type="button" aria-label="Đóng">×</button>
      <div id="dialogBody"></div>
    </div>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
