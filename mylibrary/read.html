<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Reader</title>

<!-- EPUB.js (jszip bundled inside epubjs) -->
<script src="assets/epub.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f5f0e8;
    --surface: #faf7f2;
    --surface2: #ede8df;
    --ink: #1a1610;
    --ink2: #4a4538;
    --ink3: #8a8070;
    --accent: #b5470f;
    --accent2: #d4692a;
    --border: #d8d0c0;
    --shadow: rgba(26,22,16,0.12);
    --reader-bg: #fdf9f3;
    --reader-text: #2a2318;
    --panel-w: 260px;
  }

  [data-theme="dark"] {
    --bg: #12100e;
    --surface: #1c1916;
    --surface2: #252220;
    --ink: #e8e0d0;
    --ink2: #a8a090;
    --ink3: #686058;
    --accent: #e08050;
    --accent2: #d4692a;
    --border: #332e28;
    --shadow: rgba(0,0,0,0.4);
    --reader-bg: #161411;
    --reader-text: #d8d0c0;
  }

  [data-theme="sepia"] {
    --bg: #f0e8d8;
    --surface: #f8f0e4;
    --surface2: #e8deca;
    --ink: #3a2e1e;
    --ink2: #6a5e48;
    --ink3: #9a9080;
    --accent: #8b4513;
    --border: #ccc0a8;
    --reader-bg: #f8f0e4;
    --reader-text: #3a2e1e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Lora', Georgia, serif;
    transition: background 0.3s, color 0.3s;
    overflow: hidden;
  }

  /* â”€â”€ LOADING SCREEN â”€â”€ */
  #loading-screen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px; z-index: 999;
    transition: opacity 0.5s;
  }
  #loading-screen.hide { opacity: 0; pointer-events: none; }

  .loading-logo {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .loading-bar {
    width: 200px; height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .loading-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
    border-radius: 2px;
  }
  .loading-text {
    font-size: 0.8rem;
    color: var(--ink3);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.08em;
  }

  /* â”€â”€ ERROR SCREEN â”€â”€ */
  #error-screen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; z-index: 998;
    padding: 40px;
    text-align: center;
  }
  #error-screen.show { display: flex; }
  .error-icon { font-size: 3rem; }
  .error-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--accent);
  }
  .error-msg { color: var(--ink2); max-width: 480px; line-height: 1.7; }
  .error-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    background: var(--surface2);
    padding: 10px 16px; border-radius: 6px;
    color: var(--ink3); max-width: 480px;
    word-break: break-all;
  }

  /* â”€â”€ MAIN LAYOUT â”€â”€ */
  #app {
    display: flex;
    height: 100vh;
    opacity: 0;
    transition: opacity 0.5s;
  }
  #app.ready { opacity: 1; }

  /* â”€â”€ SIDEBAR â”€â”€ */
  #sidebar {
    width: var(--panel-w);
    min-width: var(--panel-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: transform 0.3s ease, width 0.3s ease, min-width 0.3s ease;
    z-index: 10;
    overflow: hidden;
  }
  #sidebar.collapsed {
    width: 0;
    min-width: 0;
    transform: translateX(-100%);
  }

  .sidebar-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .book-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--accent);
    font-style: italic;
    margin-bottom: 16px;
    display: block;
  }

  .book-cover-wrap {
    width: 100%;
    aspect-ratio: 2/3;
    max-height: 140px;
    object-fit: contain;
    background: var(--surface2);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .book-cover-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .book-cover-placeholder {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; padding: 16px;
    width: 100%; height: 100%;
  }
  .book-cover-placeholder svg { color: var(--ink3); }
  .book-title-sidebar {
    font-family: 'Playfair Display', serif;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.4;
    margin-bottom: 4px;
  }
  .book-author-sidebar {
    font-size: 0.78rem;
    color: var(--ink3);
    font-style: italic;
  }

  /* TOC */
  .toc-section { flex: 1; overflow-y: auto; padding: 12px 0; }
  .toc-title {
    padding: 0 20px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--ink3);
    text-transform: uppercase;
  }
  .toc-item {
    display: block;
    padding: 7px 20px;
    font-size: 0.82rem;
    color: var(--ink2);
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all 0.15s;
    line-height: 1.4;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toc-item:hover { color: var(--ink); background: var(--surface2); }
  .toc-item.active {
    color: var(--accent);
    border-left-color: var(--accent);
    background: var(--surface2);
  }

  /* Sidebar footer */
  .sidebar-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .progress-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--ink3);
    letter-spacing: 0.1em;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
  }
  .progress-track {
    height: 3px; background: var(--border); border-radius: 3px;
  }
  .progress-fill {
    height: 100%; background: var(--accent); border-radius: 3px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* â”€â”€ MAIN READER AREA â”€â”€ */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--reader-bg);
  }

  /* Top bar */
  #topbar {
    height: 52px;
    min-height: 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    z-index: 5;
  }

  .btn-icon {
    width: 34px; height: 34px;
    border: none; background: none;
    color: var(--ink2);
    cursor: pointer;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .btn-icon:hover { background: var(--surface2); color: var(--ink); }
  .btn-icon svg { width: 18px; height: 18px; }

  .topbar-title {
    flex: 1;
    font-family: 'Playfair Display', serif;
    font-size: 0.95rem;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-style: italic;
    text-align: center;
  }

  .topbar-controls {
    display: flex; align-items: center; gap: 4px;
    flex-shrink: 0;
  }

  /* Settings dropdown */
  .settings-wrap { position: relative; }
  .settings-dropdown {
    position: absolute; top: 42px; right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    width: 220px;
    box-shadow: 0 8px 32px var(--shadow);
    z-index: 100;
    display: none;
  }
  .settings-dropdown.open { display: block; }

  .settings-row {
    display: flex; align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .settings-row:last-child { margin-bottom: 0; }
  .settings-label {
    font-size: 0.78rem; color: var(--ink2);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.06em;
  }
  .font-size-ctrl {
    display: flex; align-items: center; gap: 8px;
  }
  .font-size-ctrl button {
    width: 26px; height: 26px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--ink2);
    border-radius: 4px; cursor: pointer;
    font-size: 1rem; line-height: 1;
    transition: all 0.15s;
  }
  .font-size-ctrl button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .font-size-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem; color: var(--ink);
    min-width: 32px; text-align: center;
  }

  .theme-btns { display: flex; gap: 6px; }
  .theme-btn {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer; transition: border-color 0.15s;
  }
  .theme-btn.active { border-color: var(--accent); }
  .theme-btn.light { background: #f5f0e8; box-shadow: inset 0 0 0 1px #d8d0c0; }
  .theme-btn.sepia { background: #f0e8d8; box-shadow: inset 0 0 0 1px #ccc0a8; }
  .theme-btn.dark { background: #1c1916; box-shadow: inset 0 0 0 1px #332e28; }

  /* â”€â”€ EPUB READER â”€â”€ */
  #epub-container {
    flex: 1;
    display: none;
    position: relative;
    overflow: hidden;
  }
  #epub-container.active { display: flex; }

  #epub-viewer {
    flex: 1;
    overflow: hidden;
  }
  #epub-viewer iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .epub-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px; height: 80px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    opacity: 0.5;
    z-index: 5;
  }
  .epub-nav:hover { opacity: 1; color: var(--accent); }
  .epub-nav.prev { left: 0; border-radius: 0 8px 8px 0; border-left: none; }
  .epub-nav.next { right: 0; border-radius: 8px 0 0 8px; border-right: none; }
  .epub-nav svg { width: 20px; height: 20px; }

  /* â”€â”€ PDF READER â”€â”€ */
  #pdf-container {
    flex: 1;
    display: none;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  #pdf-container.active { display: flex; }

  #pdf-toolbar {
    height: 44px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    flex-shrink: 0;
  }
  .pdf-page-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink2);
    display: flex; align-items: center; gap: 6px;
  }
  .pdf-page-input {
    width: 44px; height: 26px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 4px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    padding: 0 4px;
  }
  .pdf-page-input:focus { outline: none; border-color: var(--accent); }

  .pdf-zoom-ctrl { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .pdf-zoom-ctrl button {
    width: 28px; height: 28px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink2);
    border-radius: 4px; cursor: pointer;
    font-size: 1rem; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .pdf-zoom-ctrl button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pdf-zoom-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; color: var(--ink2);
    min-width: 40px; text-align: center;
  }

  #pdf-scroll-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    background: var(--reader-bg);
    scroll-behavior: smooth;
  }
  #pdf-scroll-area::-webkit-scrollbar { width: 6px; }
  #pdf-scroll-area::-webkit-scrollbar-track { background: transparent; }
  #pdf-scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .pdf-page-wrap {
    position: relative;
    box-shadow: 0 4px 20px var(--shadow);
    border-radius: 2px;
    overflow: hidden;
    line-height: 0;
    transition: transform 0.2s;
  }
  .pdf-page-wrap canvas { display: block; }
  .pdf-page-num {
    position: absolute; bottom: 6px; right: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--ink3);
    background: var(--surface);
    padding: 2px 6px;
    border-radius: 3px;
    opacity: 0.7;
  }

  .pdf-loading-page {
    width: 600px; height: 800px;
    background: var(--surface);
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink3); font-size: 0.8rem;
    font-family: 'JetBrains Mono', monospace;
    animation: pulse 1.5s ease-in-out infinite;
    box-shadow: 0 4px 20px var(--shadow);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* â”€â”€ KEYBOARD HINT â”€â”€ */
  #kbd-hint {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--ink3);
    letter-spacing: 0.06em;
    box-shadow: 0 4px 16px var(--shadow);
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
    z-index: 50;
    white-space: nowrap;
  }
  #kbd-hint.show { opacity: 1; }

  /* Scrollbar for sidebar TOC */
  .toc-section::-webkit-scrollbar { width: 4px; }
  .toc-section::-webkit-scrollbar-track { background: transparent; }
  .toc-section::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* â”€â”€ RESPONSIVE â”€â”€ */
  @media (max-width: 640px) {
    :root { --panel-w: 80vw; }
    #sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
      transition: transform 0.3s;
      z-index: 50;
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 40;
    }
    #sidebar-overlay.show { display: block; }
  }
</style>
</head>
