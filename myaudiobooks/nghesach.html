<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nghe sách</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --ink:       #1a1410;
    --paper:     #f7f3ed;
    --warm:      #e8e0d4;
    --accent:    #8b4513;
    --accent2:   #c0832a;
    --muted:     #7a6e64;
    --line:      #d4c9bc;
    --card:      #ffffff;
    --tag-bg:    #ede7df;
    --tag-text:  #5c4a35;
    --radius:    6px;
    --shadow:    0 2px 12px rgba(26,20,16,.08);
    --shadow-lg: 0 8px 32px rgba(26,20,16,.14);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  header {
    background: var(--ink); color: var(--paper);
    padding: 0 20px; height: 56px;
    display: flex; align-items: center; gap: 14px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .back-btn {
    color: var(--paper); text-decoration: none; font-size: 18px;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; flex-shrink: 0;
  }
  .back-btn:hover { background: rgba(255,255,255,.12); }
  #headerTitle {
    font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .autoload-zone {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: calc(100vh - 56px); gap: 20px; padding: 40px 20px; text-align: center;
  }
  .autoload-icon { font-size: 48px; }
  .autoload-zone h2 { font-family: 'Playfair Display', serif; font-size: 22px; }
  .autoload-zone p { color: var(--muted); font-size: 13px; max-width: 420px; }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--line);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-folder {
    background: var(--accent); color: white; border: none; border-radius: var(--radius);
    padding: 8px 18px; cursor: pointer; font-size: 13px; font-weight: 500;
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-folder:hover { background: #7a3c10; }

  .book-zone { display: none; max-width: 920px; margin: 0 auto; padding: 24px 20px 60px; gap: 28px; flex-direction: column; }

  .book-header { display: flex; gap: 22px; }
  .book-cover {
    width: 130px; flex-shrink: 0; aspect-ratio: 2/3; border-radius: 6px; overflow: hidden;
    box-shadow: var(--shadow-lg); background: var(--warm);
  }
  .book-cover img { width: 100%; height: 100%; object-fit: contain; }
  .cover-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .cover-placeholder[data-hue="0"] { background: #ede4f0; }

  .book-meta { flex: 1; min-width: 0; }
  .book-title {
    font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700;
    line-height: 1.3; margin-bottom: 6px;
  }
  .book-creators { font-size: 14px; color: var(--accent); font-weight: 500; margin-bottom: 12px; }
  .meta-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .meta-pill {
    font-size: 11px; padding: 3px 10px; border-radius: 20px;
    background: var(--tag-bg); color: var(--tag-text); font-weight: 500;
  }
  .meta-pill.format { font-family: 'JetBrains Mono', monospace; font-size: 10px; }

  .desc-wrap { position: relative; }
  .modal-desc { font-size: 13px; line-height: 1.7; color: var(--ink); }
  .modal-desc.collapsed {
    max-height: 4.6em; overflow: hidden;
    mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
  }
  #descToggleBtn {
    background: none; border: none; color: var(--accent); font-size: 12px; font-weight: 600;
    cursor: pointer; padding: 6px 0; display: block;
  }

  .section-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 10px; flex-wrap: wrap;
  }
  .section-label {
    font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted);
  }
  .btn-download-all {
    background: var(--accent); color: white; border: none; border-radius: var(--radius);
    padding: 8px 16px; cursor: pointer; font-size: 12.5px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-download-all:hover { background: #7a3c10; }
  .btn-download-all:disabled { opacity: .5; cursor: not-allowed; }

  .chapter-list { display: flex; flex-direction: column; gap: 2px; }
  .chapter-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; border-radius: var(--radius);
    background: var(--card); border: 1px solid var(--line);
    font-size: 13.5px; color: var(--ink);
    margin-bottom: 6px;
  }
  .chapter-num {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted);
    width: 28px; flex-shrink: 0; text-align: right;
  }
  .chapter-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chapter-size {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); flex-shrink: 0;
  }
  .chapter-dl-btn {
    background: var(--tag-bg); color: var(--accent); border: 1px solid var(--line);
    border-radius: 50%; width: 32px; height: 32px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 15px; text-decoration: none; transition: background .12s, border-color .12s;
  }
  .chapter-dl-btn:hover { background: var(--warm); border-color: var(--accent); }
  .chapter-dl-btn.done { color: #2e7d32; border-color: #2e7d32; background: #eaf6ea; }

  @media (max-width: 700px) {
    .book-header { flex-direction: column; align-items: center; text-align: center; }
    .book-cover { width: 110px; }
    .meta-row { justify-content: center; }
    .chapter-title { white-space: normal; }
  }
</style>
</head>
<body>

<header>
  <a class="back-btn" id="backLink" href="index.html" title="Quay lại danh sách">←</a>
  <div id="headerTitle">Nghe sách</div>
</header>

<div class="autoload-zone" id="loadingZone">
  <div class="autoload-icon">🎧</div>
  <h2>Đang tải sách…</h2>
  <p>Đang lấy thông tin và danh sách chương từ Google Drive.</p>
  <div class="spinner"></div>
</div>

<div class="book-zone" id="bookZone">
  <div class="book-header">
    <div class="book-cover" id="bookCover"></div>
    <div class="book-meta">
      <div class="book-title" id="bookTitle"></div>
      <div class="book-creators" id="bookCreators"></div>
      <div class="meta-row" id="bookPills"></div>
      <div class="desc-wrap">
        <div class="modal-desc collapsed" id="bookDesc"></div>
        <button id="descToggleBtn" onclick="toggleDesc()">Xem thêm ▾</button>
      </div>
    </div>
  </div>

  <div>
    <div class="section-head">
      <div class="section-label">Danh sách chương</div>
      <button class="btn-download-all" id="btnDownloadAll" onclick="downloadAllChapters()">⬇ Tải xuống tất cả</button>
    </div>
    <div class="chapter-list" id="chapterList"></div>
  </div>
</div>

<script src="audiobooks-common.js?v=2"></script>
<script src="nghesach.js?v=2"></script>
</body>
</html>
